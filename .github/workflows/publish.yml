name: Publish to NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Pack + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required so NuGet/login can request a GitHub OIDC token

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Xfty.ci-cross-platform.slnf is Xfty.slnx minus Xfty.NetStandardCompat.Test,
      # which targets net472 and can't run on this Linux runner - see ci.yml's
      # windows-net472 job, which already covers it on every push/PR to master.
      - name: Restore
        run: dotnet restore Xfty.ci-cross-platform.slnf

      - name: Build (Release)
        run: dotnet build Xfty.ci-cross-platform.slnf -c Release --no-restore

      - name: Test (excluding the informational performance suite)
        run: dotnet test Xfty.ci-cross-platform.slnf -c Release --no-build --filter "Category!=Performance"

      - name: Verify package versions
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME

          if (-not $tag.StartsWith("v")) {
              Write-Error "Release tag '$tag' does not start with 'v'."
              exit 1
          }

          $expectedVersion = $tag.Substring(1)

          Write-Host "Release tag:      $tag"
          Write-Host "Expected version: $expectedVersion"
          Write-Host ""

          $publishableProjects = @(
              "Xfty/Xfty.csproj",
              "Xfty.EntityFrameworkCore/Xfty.EntityFrameworkCore.csproj",
              "Xfty.Bogus/Xfty.Bogus.csproj",
              "Xfty.VectorDatabases/Xfty.VectorDatabases.csproj",
              "Xfty.Xunit/Xfty.Xunit.csproj",
              "Xfty.AutoFixture/Xfty.AutoFixture.csproj",
              "Xfty.AutoBogus/Xfty.AutoBogus.csproj",
              "Xfty.FSharpAsync/Xfty.FSharpAsync.fsproj",
              "Xfty.VectorDatabases.Qdrant/Xfty.VectorDatabases.Qdrant.csproj",
              "Xfty.VectorDatabases.MicrosoftExtensionsVectorData/Xfty.VectorDatabases.MicrosoftExtensionsVectorData.csproj"
          )

          $previewProjects = @(
              "Xfty.VectorDatabases.Qdrant/Xfty.VectorDatabases.Qdrant.csproj",
              "Xfty.VectorDatabases.MicrosoftExtensionsVectorData/Xfty.VectorDatabases.MicrosoftExtensionsVectorData.csproj"
          )

          $failed = $false

          foreach ($project in $publishableProjects) {
              [xml]$projectXml = Get-Content $project
              $version = $projectXml.Project.PropertyGroup.Version | Select-Object -First 1

              if ([string]::IsNullOrWhiteSpace($version)) {
                  Write-Error "$project does not define <Version>."
                  $failed = $true
                  continue
              }

              if ($previewProjects -contains $project) {
                  Write-Host "PREVIEW  $project -> $version"
                  continue
              }

              if ($version -ne $expectedVersion) {
                  Write-Error "$project has version '$version', but release tag '$tag' requires '$expectedVersion'."
                  $failed = $true
              }
              else {
                  Write-Host "MATCH    $project -> $version"
              }
          }

          if ($failed) {
              Write-Error "Package version validation failed. No packages will be created or published."
              exit 1
          }

          "PACKAGE_VERSION=$expectedVersion" >> $env:GITHUB_ENV

      - name: Pack every publishable package
        run: |
          mkdir -p ./packages
          for proj in \
            Xfty/Xfty.csproj \
            Xfty.EntityFrameworkCore/Xfty.EntityFrameworkCore.csproj \
            Xfty.Bogus/Xfty.Bogus.csproj \
            Xfty.VectorDatabases/Xfty.VectorDatabases.csproj \
            Xfty.Xunit/Xfty.Xunit.csproj \
            Xfty.AutoFixture/Xfty.AutoFixture.csproj \
            Xfty.AutoBogus/Xfty.AutoBogus.csproj \
            Xfty.FSharpAsync/Xfty.FSharpAsync.fsproj \
            Xfty.VectorDatabases.Qdrant/Xfty.VectorDatabases.Qdrant.csproj \
            Xfty.VectorDatabases.MicrosoftExtensionsVectorData/Xfty.VectorDatabases.MicrosoftExtensionsVectorData.csproj \
          ; do
            dotnet pack "$proj" -c Release --no-build -o ./packages
          done

      - name: Verify generated package versions
        shell: pwsh
        run: |
          $expectedVersion = $env:PACKAGE_VERSION
          $previewProjects = @(
              "Xfty.VectorDatabases.Qdrant",
              "Xfty.VectorDatabases.MicrosoftExtensionsVectorData"
          )

          $packages = Get-ChildItem "./packages/*.nupkg"

          if ($packages.Count -eq 0) {
              Write-Error "No NuGet packages were generated."
              exit 1
          }

          $failed = $false

          foreach ($package in $packages) {
              $packageName = $package.BaseName

              $isPreviewPackage = $false

              foreach ($previewProject in $previewProjects) {
                  if ($packageName.StartsWith("$previewProject.")) {
                      $isPreviewPackage = $true
                      break
                  }
              }

              if ($isPreviewPackage) {
                  Write-Host "PREVIEW PACKAGE  $($package.Name)"
                  continue
              }

              if (-not $packageName.EndsWith(".$expectedVersion")) {
                  Write-Error "Generated package '$($package.Name)' does not contain expected version '$expectedVersion'."
                  $failed = $true
              }
              else {
                  Write-Host "VERSION MATCH     $($package.Name)"
              }
          }

          if ($failed) {
              Write-Error "Generated package version validation failed. Nothing will be published."
              exit 1
          }

      - name: NuGet login (OIDC -> short-lived API key, no stored secret)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USERNAME }} # nuget.org profile name, not email - see docs/contribute/packaging.md

      - name: Push to nuget.org
        run: >
          dotnet nuget push "./packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json

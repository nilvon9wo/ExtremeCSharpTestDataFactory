name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Xfty.ci-cross-platform.slnf is Xfty.slnx minus Xfty.NetStandardCompat.Test -
      # that one targets net472 to prove Xfty's netstandard2.0 build actually runs
      # (netstandard2.0 isn't itself a runnable platform), and .NET Framework
      # binaries can't execute on Linux at all. See the windows-net472 job below.
      - name: Restore
        run: dotnet restore Xfty.ci-cross-platform.slnf

      - name: Build (strict .editorconfig analyzers enforced)
        run: dotnet build Xfty.ci-cross-platform.slnf --no-restore

      # Every whitespace/formatting rule, and a second pass over the style and
      # naming analyzers the build already runs.
      - name: Verify code style, naming, and formatting (dotnet format)
        run: dotnet format Xfty.slnx --verify-no-changes --severity info

      # IDE0005 (unnecessary using) never fails `dotnet build`, even with
      # EnforceCodeStyleInBuild. ReSharper's inspectcode catches it and more;
      # every finding fails. --no-build is deliberate (see the script): the
      # build step above owns compilation.
      - name: Restore local tools
        run: dotnet tool restore

      - name: ReSharper inspections (inspectcode)
        run: python3 scripts/inspect-code.py Xfty.ci-cross-platform.slnf

      # Roslyn reads max_line_length but never reports on it, and only
      # Rider/ReSharper honour the wrapped-')' rules - so neither the build nor
      # dotnet format above enforces them. This scripted check does.
      - name: Verify line length and wrapped ')' placement
        run: python3 scripts/check-line-layout.py

      # Every test project also enforces 100% line and branch coverage of its
      # package (coverlet.MTP, wired in Directory.Build.props).
      - name: Test (excluding the informational performance suite)
        run: dotnet test Xfty.ci-cross-platform.slnf --no-build --filter "Category!=Performance"

      # Xfty.Test is the only project with any Category=Performance tests - targeting
      # the whole solution filter here made every other project report "zero tests
      # ran" (a failure exit code), which continue-on-error silently swallowed
      # alongside any real performance regression. Scoping to the one project that
      # actually has these tests means this step's outcome means something again;
      # continue-on-error stays, for the reason the step's name already says -
      # wall-clock-based assertions are expected to be flaky across CI runners.
      # -p:XftyCoverage=false: the Performance tests alone can never meet the
      # 100% coverage bar every other test run enforces (Directory.Build.props).
      - name: Performance suite (informational - wall-clock ceilings are generous but CI runners vary)
        continue-on-error: true
        run: dotnet test Xfty.Test/Xfty.Test.csproj --no-build -p:XftyCoverage=false --filter "Category=Performance"

      - name: Verify every documented code example is exercised by a real test
        run: python3 scripts/verify-doc-examples.py

      - name: Verify every relative doc link and anchor resolves
        run: python3 scripts/verify-doc-links.py

      # A gate that silently stops running looks exactly like one that passes.
      # Runs every gate above against StyleCanary/ (deliberately non-compliant
      # code, each violation tagged with the gate that must report it), plus a
      # temporary uncovered class and a temporary broken doc page, and fails if
      # any gate no longer catches them. See StyleCanary/README.md.
      - name: Prove every gate still catches its canary violations
        run: python3 scripts/verify-gates.py

  windows-net472:
    name: netstandard2.0 compat (net472)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Proves the netstandard2.0-only polyfills in Xfty/Internal/NetStandardCompat.cs
      # (GetValueOrDefault/ToHashSet/SharedRandom) actually run, not just compile -
      # net472 is the one real runtime this repo targets that implements
      # netstandard2.0, so referencing Xfty from here resolves to that build.
      - name: Restore
        run: dotnet restore Xfty.NetStandardCompat.Test/Xfty.NetStandardCompat.Test.csproj

      - name: Build
        run: dotnet build Xfty.NetStandardCompat.Test/Xfty.NetStandardCompat.Test.csproj --no-restore

      # The Linux job inspects everything else; this project only restores here.
      - name: ReSharper inspections (inspectcode)
        run: |
          dotnet tool restore
          python scripts/inspect-code.py Xfty.NetStandardCompat.Test/Xfty.NetStandardCompat.Test.csproj

      - name: Test
        run: dotnet test Xfty.NetStandardCompat.Test/Xfty.NetStandardCompat.Test.csproj --no-build
